   name: Update APT Repository                                                                                          
                                                                                                                        
   on:                                                                                                                  
     push:                                                                                                              
       branches:                                                                                                        
         - main                                                                                                         
     workflow_dispatch:                                                                                                 
                                                                                                                        
   jobs:                                                                                                                
     update-apt:                                                                                                        
       runs-on: ubuntu-latest                                                                                           
                                                                                                                        
       steps:                                                                                                           
         - name: Checkout                                                                                               
           uses: actions/checkout@v4                                                                                    
           with:                                                                                                        
             fetch-depth: 0                                                                                             
                                                                                                                        
         - name: Install tools                                                                                          
           run: |                                                                                                       
             sudo apt-get update                                                                                        
             sudo apt-get install -y dpkg-dev apt-utils gnupg                                                           
                                                                                                                        
         - name: Import GPG key                                                                                         
           uses: crazy-max/ghaction-import-gpg@v6                                                                       
           with:                                                                                                        
             gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}                                                            
             base64_encoded: true                                                                                       
                                                                                                                        
         - name: Generate Packages index                                                                                
           run: |                                                                                                       
             dpkg-scanpackages --multiversion . > Packages                                                              
             gzip -9c Packages > Packages.gz                                                                            
                                                                                                                        
         - name: Generate Release                                                                                       
           run: |                                                                                                       
             apt-ftparchive release . > Release                                                                         
                                                                                                                        
         - name: Sign Release                                                                                           
           run: |                                                                                                       
             gpg --batch --yes --pinentry-mode loopback \                                                               
               --passphrase "${{ secrets.GPG_PASSPHRASE }}" \                                                           
               --armor --detach-sign --output Release.gpg Release                                                       
                                                                                                                        
         - name: Commit and push                                                                                        
           run: |                                                                                                       
             git config user.name "github-actions"                                                                      
             git config user.email "github-actions@github.com"                                                          
             git add Packages Packages.gz Release Release.gpg                                                           
             git commit -m "Update APT repository metadata" || echo "No changes"                                        
             git push  
